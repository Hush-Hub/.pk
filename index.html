<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hush Hub | Ladies’ Suits in Pakistan</title>
<meta name="description" content="Hush Hub: ladies’ lawn, khaddar, formal and luxury pret suits, delivered across Pakistan with cash on delivery.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0E0D0B;--surf:#181612;--ink:#F3EBDD;--mut:#A89F8D;--acc:#C9A24B;--deep:#C9A24B;--ondeep:#14110B;--line:#2E2A22;--sale:#E5C16A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Jost,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.05;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
#bar{background:var(--acc);color:#14110B;text-align:center;padding:9px 16px;font-weight:600;font-size:15px}
#bar b{background:#14110B;color:#E5C16A;border-radius:4px;padding:1px 8px;margin-left:8px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:600 26px "Cormorant Garamond",serif;letter-spacing:.06em;text-decoration:none}.logo svg{width:20px;height:40px}.strip{border-block:1px solid var(--line);color:var(--mut);font-size:15px}.strip .wrap{display:flex;gap:10px 34px;flex-wrap:wrap;justify-content:center;padding-block:14px}
nav{display:flex;gap:26px}nav a{text-decoration:none;color:var(--mut);font-weight:600}nav a:hover{color:var(--ink)}
.cart{background:var(--deep);color:var(--ondeep);border:0;border-radius:99px;padding:8px 18px;font-weight:600}
.hero{padding:84px 0 92px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(46px,8vw,104px);font-weight:600;max-width:10ch}
.hero p{font-size:20px;color:var(--mut);max-width:34em;margin:22px 0 32px}
.btn{display:inline-block;background:var(--deep);color:var(--ondeep);border:0;border-radius:99px;padding:14px 30px;font-weight:600;text-decoration:none}
.btn.alt{background:var(--acc);color:#14110B}
.rings{position:absolute;right:6%;top:50%;width:300px;height:600px;transform:translateY(-50%);pointer-events:none;opacity:.9}
.rings circle{fill:none;stroke:currentColor;opacity:.35;transform-origin:center;animation:hush 9s ease-in-out infinite}
.rings circle:nth-child(2){animation-delay:-1.5s}.rings circle:nth-child(3){animation-delay:-3s}.rings circle:nth-child(4){animation-delay:-4.5s}
@keyframes hush{50%{transform:scale(.9);opacity:.12}}
@media (prefers-reduced-motion:reduce){.rings circle{animation:none}html{scroll-behavior:auto}}
.sec{padding:70px 0}
.sec h2{font-size:clamp(30px,4.5vw,50px);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--surf);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;position:relative;background-size:cover;background-position:center}
.tag{position:absolute;top:14px;left:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;border-radius:99px;padding:3px 12px}
.tag.s{background:var(--acc);color:#14110B}
.info{padding:18px 20px 22px;display:flex;flex-direction:column;gap:4px;flex:1}
.info small{color:var(--mut)}
.info h3{font-size:20px}
.price{font-weight:600;margin-top:auto;padding-top:10px}
.price s{color:var(--mut);font-weight:400;margin-right:8px}.price em{font-style:normal;color:var(--sale)}
.add{margin-top:12px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:99px;padding:9px;font-weight:600}
.add:hover{background:var(--ink);color:var(--bg)}
.band{padding:80px 0}
.band.deep{background:var(--surf);color:var(--ink)}.band.warm{background:var(--acc);color:#14110B}.band.light{background:var(--surf)}
.band .wrap{max-width:820px}.band h2{font-size:clamp(30px,5vw,56px);margin-bottom:18px}
.band p{font-size:19px;margin:0 0 26px;white-space:pre-line;opacity:.92}
.band.warm .btn{background:#14110B;color:#EEF0F7}.band.deep .btn{background:var(--acc);color:#14110B}
.news{display:flex;gap:10px;flex-wrap:wrap}.news input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:13px 20px;font:inherit}
footer{border-top:1px solid var(--line);padding:46px 0;color:var(--mut);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
/* admin */
#adm{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surf);color:var(--ink);border-left:1px solid var(--line);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#adm.on{display:flex}
#adm .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
#adm .tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
#adm .tabs button{border:0;background:none;color:var(--mut);padding:7px 13px;border-radius:99px;font-weight:600;white-space:nowrap}
#adm .tabs button.on{background:var(--deep);color:var(--ondeep)}
#adm .body{padding:18px;overflow-y:auto;flex:1}
#adm label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
#adm input,#adm textarea,#adm select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
#adm input[type=checkbox]{width:auto;margin-right:8px}
#adm .row{display:flex;gap:10px}#adm .row>*{flex:1}
#adm .box{border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px;margin:14px 0}
#adm .sm{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600;margin:10px 8px 0 0}
#adm .sm.red{color:var(--sale)}
#adm .hint{color:var(--mut);font-size:14px}
@media (max-width:700px){nav{display:none}.rings{opacity:.25;right:-40px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0" stop-color="#F0D78A"/><stop offset="1" stop-color="#B8893A"/></linearGradient><symbol id="mk" viewBox="0 0 100 200" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 44C62 38 66 30 62 22A12 12 0 1 0 38 22C34 30 38 38 50 44ZM50 156C62 162 66 170 62 178A12 12 0 1 1 38 178C34 170 38 162 50 156Z"/><path d="M50 44C14 76 14 124 50 156M50 44C86 76 86 124 50 156"/><path d="M34 88v24M46 88v24M34 100h12M54 88v24M66 88v24M54 100h12"/></symbol></defs></svg>
<div id="bar"></div>
<header><div class="wrap"><a class="logo" href="#top" aria-label="Hush Hub home"><svg viewBox="0 0 100 200"><use href="#mk"/></svg>Hush Hub</a><nav id="nav"></nav><button class="cart" onclick="toast('Checkout isn’t connected yet')">Bag (<span id="cc">0</span>)</button></div></header>
<main id="top">
<section class="hero"><svg class="rings" viewBox="0 0 100 200" aria-hidden="true"><use href="#mk"/></svg>
<div class="wrap"><h1 id="h1"></h1><p id="hp"></p><a class="btn" id="hb" href="#shop"></a></div></section>
<div class="strip"><div class="wrap"><span>Cash on delivery</span><span>Free delivery across Pakistan over Rs 5,000</span><span>7-day exchange</span></div></div>
<section class="sec" id="shop"><div class="wrap"><h2>New arrivals</h2><div class="grid" id="grid"></div></div></section>
<div id="secs"></div>
<section class="sec" id="join"><div class="wrap"><h2>Get Rs 500 off your first order</h2><div class="news"><input id="em" type="email" placeholder="Your email" aria-label="Email"><button class="btn" onclick="sub()">Join the list</button></div></div></section>
</main>
<footer><div class="wrap"><div><b style="color:var(--ink)">Hush Hub</b><br>Ladies’ suits, made to be worn.</div><div>Delivering across Pakistan · Cash on delivery · Exchange<br>© 2026 Hush Hub</div></div></footer>
<aside id="adm" aria-label="Site editor"><div class="top"><b>Edit Hush Hub</b><button class="sm" onclick="closeAdm()">Close</button></div><div class="tabs" id="tabs"></div><div class="body" id="ab"></div></aside>
<div id="toast" role="status"></div>
<script>
var KEY='hushhub-v2',cart=0,tab='sale';
var DEF={cur:'Rs',sale:{on:true,text:'Winter sale: up to 30% off selected suits. Use code',code:'HUSH30'},
hero:{title:'Elegance, stitched with care.',sub:'Ladies’ suits in lawn, khaddar, organza and raw silk, unstitched and ready to wear, delivered across Pakistan.',cta:'Shop suits'},
products:[
{name:'Noor Embroidered Lawn 3-Piece',cat:'Lawn, unstitched',price:'8900',sale:'6900',color:'#7B2D3B',badge:'',img:''},
{name:'Zari Organza Formal 3-Piece',cat:'Formal',price:'18500',sale:'',color:'#1F3B4D',badge:'New',img:''},
{name:'Khaddar Winter 2-Piece',cat:'Winter',price:'5200',sale:'',color:'#8A6A3B',badge:'Best seller',img:''},
{name:'Chikankari Kurta',cat:'Ready to wear',price:'4800',sale:'3900',color:'#B28A8F',badge:'',img:''},
{name:'Raw Silk Luxury Pret',cat:'Luxury pret',price:'14500',sale:'',color:'#4B2E5A',badge:'',img:''},
{name:'Cotton Net Dupatta',cat:'Dupattas',price:'2200',sale:'',color:'#2F5D50',badge:'',img:''}],
sections:[{title:'Dressed for every occasion',body:'From everyday lawn to wedding-season formals, every Hush Hub suit is cut from carefully chosen fabric and finished by hand.',btn:'Our story',tone:'deep'}]};
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Not saved: storage is full. Use smaller images.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2200)}
function money(v){return S.cur+' '+Number(v).toLocaleString('en-PK')}
function sub(){var e=$('em');if(!/.+@.+\..+/.test(e.value)){toast('Enter a valid email');return}e.value='';toast('You’re on the list')}
function add(){cart++;$('cc').textContent=cart;toast('Added to your bag')}
function render(){
 var b=$('bar');b.style.display=S.sale.on?'block':'none';b.innerHTML=esc(S.sale.text)+(S.sale.code?'<b>'+esc(S.sale.code)+'</b>':'');
 $('h1').textContent=S.hero.title;$('hp').textContent=S.hero.sub;$('hb').textContent=S.hero.cta;
 $('grid').innerHTML=S.products.map(function(p,i){
  var on=p.sale&&Number(p.sale)<Number(p.price);
  var bg=p.img?'url('+p.img+')':'radial-gradient(circle at 30% 25%,'+esc(p.color)+'99,'+esc(p.color)+' 70%)';
  var tag=on?'<span class="tag s">Sale</span>':(p.badge?'<span class="tag">'+esc(p.badge)+'</span>':'');
  return '<article class="card"><div class="pic" style="background-image:'+bg+'">'+tag+'</div><div class="info"><small>'+esc(p.cat)+'</small><h3>'+esc(p.name)+'</h3><div class="price">'+(on?'<s>'+money(p.price)+'</s><em>'+money(p.sale)+'</em>':money(p.price))+'</div><button class="add" onclick="add()">Add to bag</button></div></article>'}).join('')||'<p>No products yet.</p>';
 $('secs').innerHTML=S.sections.map(function(s,i){return '<section class="band '+esc(s.tone)+'" id="s'+i+'"><div class="wrap"><h2>'+esc(s.title)+'</h2><p>'+esc(s.body)+'</p>'+(s.btn?'<a class="btn" href="#top">'+esc(s.btn)+'</a>':'')+'</div></section>'}).join('');
 $('nav').innerHTML='<a href="#shop">Shop</a>'+S.sections.map(function(s,i){return '<a href="#s'+i+'">'+esc(s.title.split(' ').slice(0,2).join(' '))+'</a>'}).join('')+'<a href="#join">Join</a>';
}
/* admin */
var TABS=[['sale','Sale'],['hero','Homepage'],['products','Products'],['sections','Sections'],['data','Backup']];
function inp(k,l,v,t){return '<label>'+l+'</label><input data-k="'+k+'" value="'+esc(v)+'"'+(t?' inputmode="'+t+'"':'')+'>'}
function adm(){
 $('tabs').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="tab=\''+t[0]+'\';adm()">'+t[1]+'</button>'}).join('');
 var h='';
 if(tab=='sale'){h='<label><input type="checkbox" data-k="sale.on"'+(S.sale.on?' checked':'')+'>Show sale banner</label>'+inp('sale.text','Banner message',S.sale.text)+inp('sale.code','Promo code (optional)',S.sale.code)+inp('cur','Currency label',S.cur)+'<p class="hint">To put one product on sale, open Products and type a sale price. It shows a Sale tag and the old price crossed out.</p>'}
 if(tab=='hero'){h=inp('hero.title','Headline',S.hero.title)+'<label>Subtitle</label><textarea rows="3" data-k="hero.sub">'+esc(S.hero.sub)+'</textarea>'+inp('hero.cta','Button text',S.hero.cta)}
 if(tab=='products'){h=S.products.map(function(p,i){var k='products.'+i+'.';return '<div class="box"><div class="row">'+inp(k+'name','Name',p.name)+inp(k+'cat','Category',p.cat)+'</div><div class="row">'+inp(k+'price','Price (Rs)',p.price,'decimal')+inp(k+'sale','Sale price (Rs)',p.sale,'decimal')+'</div><div class="row">'+inp(k+'badge','Tag (e.g. New)',p.badge)+'<div><label>Colour</label><input type="color" data-k="'+k+'color" value="'+esc(p.color)+'"></div></div><label>Photo</label><input type="file" accept="image/*" data-img="'+i+'"><button class="sm" onclick="rm(\'products\','+i+')">Remove</button>'+(p.img?'<button class="sm" onclick="S.products['+i+'].img=\'\';save();render();adm()">Remove photo</button>':'')+'</div>'}).join('')+'<button class="sm" onclick="S.products.unshift({name:\'New product\',cat:\'Category\',price:\'0\',sale:\'\',color:\'#6A72B8\',badge:\'New\',img:\'\'});save();render();adm()">+ Add product</button>'}
 if(tab=='sections'){h=S.sections.map(function(s,i){var k='sections.'+i+'.';return '<div class="box">'+inp(k+'title','Title',s.title)+'<label>Text</label><textarea rows="4" data-k="'+k+'body">'+esc(s.body)+'</textarea>'+inp(k+'btn','Button text (blank = none)',s.btn)+'<label>Style</label><select data-k="'+k+'tone">'+['deep','warm','light'].map(function(t){return '<option value="'+t+'"'+(s.tone==t?' selected':'')+'>'+{deep:'Dark',warm:'Peach',light:'White'}[t]+'</option>'}).join('')+'</select><button class="sm" onclick="mv('+i+',-1)">Up</button><button class="sm" onclick="mv('+i+',1)">Down</button><button class="sm red" onclick="rm(\'sections\','+i+')">Remove</button></div>'}).join('')+'<button class="sm" onclick="S.sections.push({title:\'New section\',body:\'Write something here.\',btn:\'\',tone:\'light\'});save();render();adm()">+ Add section</button>'}
 if(tab=='data'){h='<p class="hint">Edits save in this browser only. Copy this backup somewhere safe, or paste a backup below to restore it.</p><textarea id="bk" rows="9">'+esc(JSON.stringify(S))+'</textarea><button class="sm" onclick="restore()">Load pasted backup</button><button class="sm red" onclick="if(confirm(\'Reset everything to the starter site?\')){S=JSON.parse(JSON.stringify(DEF));save();render();adm()}">Reset site</button>'}
 $('ab').innerHTML=h;
}
function rm(a,i){if(confirm('Remove this?')){S[a].splice(i,1);save();render();adm()}}
function mv(i,d){var j=i+d;if(j<0||j>=S.sections.length)return;var t=S.sections[i];S.sections[i]=S.sections[j];S.sections[j]=t;save();render();adm()}
function restore(){try{var o=JSON.parse($('bk').value);if(!o.products||!o.sections)throw 0;S=o;save();render();adm();toast('Backup loaded')}catch(e){toast('That backup isn’t valid')}}
function openAdm(){$('adm').classList.add('on');adm()}
function closeAdm(){$('adm').classList.remove('on');if(location.hash=='#admin')location.hash='top'}
$('ab').addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-k');if(!k)return;var v=t.type=='checkbox'?t.checked:t.value,p=k.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;save();render()});
$('ab').addEventListener('change',function(e){var t=e.target,i=t.getAttribute('data-img');if(i===null||!t.files[0])return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.products[i].img=c.toDataURL('image/jpeg',.8);save();render();adm()};im.src=r.result};r.readAsDataURL(t.files[0])});
function route(){if(location.hash=='#admin')openAdm()}
window.addEventListener('hashchange',route);render();route();
</script>
</body>
</html>
