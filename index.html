<style>
:root{color-scheme:dark;--bg:#0E0D0B;--surf:#181612;--ink:#F3EBDD;--mut:#A89F8D;--acc:#C9A24B;--deep:#C9A24B;--ondeep:#14110B;--line:#2E2A22;--sale:#E5C16A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Jost,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.05;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
#bar{background:var(--acc);color:#14110B;text-align:center;padding:9px 16px;font-weight:600;font-size:15px}
#bar b{background:#14110B;color:#E5C16A;border-radius:4px;padding:1px 8px;margin-left:8px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:10px;font:600 26px "Cormorant Garamond",serif;letter-spacing:.06em;text-decoration:none}.logo svg{width:20px;height:40px}.strip{border-block:1px solid var(--line);color:var(--mut);font-size:15px}.strip .wrap{display:flex;gap:10px 34px;flex-wrap:wrap;justify-content:center;padding-block:14px}
nav{display:flex;gap:26px}nav a{text-decoration:none;color:var(--mut);font-weight:600}nav a:hover{color:var(--ink)}
.cart{background:var(--deep);color:var(--ondeep);border:0;border-radius:99px;padding:8px 18px;font-weight:600}
.hero{padding:84px 0 92px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(46px,8vw,104px);font-weight:600;max-width:10ch}
.hero p{font-size:20px;color:var(--mut);max-width:34em;margin:22px 0 32px}
.btn{display:inline-block;background:var(--deep);color:var(--ondeep);border:0;border-radius:99px;padding:14px 30px;font-weight:600;text-decoration:none}
.btn.alt{background:var(--acc);color:#14110B}
.rings{position:absolute;right:6%;top:50%;width:300px;height:600px;transform:translateY(-50%);pointer-events:none;opacity:.9}
.rings circle{fill:none;stroke:currentColor;opacity:.35;transform-origin:center;animation:hush 9s ease-in-out infinite}
.rings circle:nth-child(2){animation-delay:-1.5s}.rings circle:nth-child(3){animation-delay:-3s}.rings circle:nth-child(4){animation-delay:-4.5s}
@keyframes hush{50%{transform:scale(.9);opacity:.12}}
@media (prefers-reduced-motion:reduce){.rings circle{animation:none}html{scroll-behavior:auto}}
.sec{padding:70px 0}
.sec h2{font-size:clamp(30px,4.5vw,50px);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--surf);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;position:relative;background-size:cover;background-position:center}
.tag{position:absolute;top:14px;left:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;border-radius:99px;padding:3px 12px}
.tag.s{background:var(--acc);color:#14110B}
.info{padding:18px 20px 22px;display:flex;flex-direction:column;gap:4px;flex:1}
.info small{color:var(--mut)}
.info h3{font-size:20px}
.price{font-weight:600;margin-top:auto;padding-top:10px}
.price s{color:var(--mut);font-weight:400;margin-right:8px}.price em{font-style:normal;color:var(--sale)}
.add{margin-top:12px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:99px;padding:9px;font-weight:600}
.add:hover{background:var(--ink);color:var(--bg)}
.winter{background:var(--surf);border-block:1px solid var(--line)}.winter .card{background:var(--bg)}.sub{color:var(--mut);font-size:18px;margin:-18px 0 30px;max-width:40em}
.pic{cursor:zoom-in}.lnk{cursor:pointer}.lnk:hover{text-decoration:underline}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:none;align-items:center;justify-content:center;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}#pv.on{display:flex}
.pvb{background:var(--surf);border-radius:20px;max-width:940px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;position:relative}
.pvi{aspect-ratio:1/1;background-color:var(--bg);background-repeat:no-repeat;background-position:center}
.pvt{padding:34px;display:flex;flex-direction:column;gap:10px;justify-content:center}.pvt small{color:var(--mut)}.pvt h2{font-size:clamp(30px,4vw,44px)}.pvt p{color:var(--mut);margin:6px 0 14px}.pvt .price{font-size:22px}.pvt .btn{align-self:flex-start}
.pvx{position:absolute;top:10px;right:12px;z-index:2;font-size:28px;line-height:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);width:42px;height:42px;border-radius:50%}
@media (max-width:700px){.pvb{grid-template-columns:1fr}.pvt{padding:22px}}
#ct{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surf);color:var(--ink);border-left:1px solid var(--line);z-index:35;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#ct.on{display:flex}
#ct .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}#ct .top b{font:600 26px "Cormorant Garamond",serif}
.x{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}
#cb{padding:18px 20px 26px;overflow-y:auto;flex:1}#cb h3{font-size:28px;margin-bottom:8px}.hint{color:var(--mut);font-size:14px}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li .th{width:58px;height:58px;border-radius:10px;flex:none}.li .nm{flex:1;font-weight:600;line-height:1.3}.li .nm small{display:block;color:var(--mut);font-weight:400}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink)}
.tot{display:flex;justify-content:space-between;padding:6px 0}.tot.g{font-weight:600;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
#cb label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}#cb input,#cb textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
#cb .btn{display:block;width:100%;text-align:center;margin-top:16px}.lk{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:12px;padding:0}
.band{padding:80px 0}
.band.deep{background:var(--surf);color:var(--ink)}.band.warm{background:var(--acc);color:#14110B}.band.light{background:var(--surf)}
.band .wrap{max-width:820px}.band h2{font-size:clamp(30px,5vw,56px);margin-bottom:18px}
.band p{font-size:19px;margin:0 0 26px;white-space:pre-line;opacity:.92}
.band.warm .btn{background:#14110B;color:#EEF0F7}.band.deep .btn{background:var(--acc);color:#14110B}
.news{display:flex;gap:10px;flex-wrap:wrap}.news input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:13px 20px;font:inherit}
footer{border-top:1px solid var(--line);padding:46px 0;color:var(--mut);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
/* admin */
#adm{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surf);color:var(--ink);border-left:1px solid var(--line);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#adm.on{display:flex}
#adm .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
#adm .tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
#adm .tabs button{border:0;background:none;color:var(--mut);padding:7px 13px;border-radius:99px;font-weight:600;white-space:nowrap}
#adm .tabs button.on{background:var(--deep);color:var(--ondeep)}
#adm .body{padding:18px;overflow-y:auto;flex:1}
#adm label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
#adm input,#adm textarea,#adm select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
#adm input[type=checkbox]{width:auto;margin-right:8px}
#adm .row{display:flex;gap:10px}#adm .row>*{flex:1}
#adm .box{border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px;margin:14px 0}
#adm .sm{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600;margin:10px 8px 0 0}
#adm .sm.red{color:var(--sale)}
#adm .hint{color:var(--mut);font-size:14px}
@media (max-width:700px){nav{display:none}.rings{opacity:.25;right:-40px}}
</style>
</head>

<script>
var KEY='hushhub-v3',cart=[],tab='sale';
var DEF={"cur": "Rs", "sale": {"on": true, "text": "Launch offer: Rs 500 off your first order. Use code", "code": "NEW500"}, "hero": {"title": "Wear it easy.", "sub": "Hoodies, trousers and everyday accessories for men and women, made for comfort and delivered across Pakistan.", "cta": "Shop now"}, "products": [{"name": "Essential Oversized Hoodie", "cat": "Hoodies", "price": "4500", "sale": "3600", "color": "#3A3F4B", "badge": "Best seller", "img": "", "desc": "Soft brushed cotton blend with a relaxed, oversized fit. Everyday comfort for men and women."}, {"name": "Zip-Up Fleece Hoodie", "cat": "Hoodies", "price": "5200", "sale": "", "color": "#6B4F3A", "badge": "New", "img": "", "desc": "Warm fleece lining, full zip and two deep pockets. Easy to layer."}, {"name": "Relaxed Cargo Trousers", "cat": "Trousers", "price": "4800", "sale": "3900", "color": "#4A5A43", "badge": "", "img": "", "desc": "Loose fit with roomy cargo pockets and an adjustable waist."}, {"name": "Straight Fit Chino Trousers", "cat": "Trousers", "price": "4200", "sale": "", "color": "#8A7355", "badge": "", "img": "", "desc": "Clean straight cut in soft stretch cotton. Smart enough for work, easy enough for weekends."}, {"name": "Everyday Tote Bag", "cat": "Accessories", "price": "2800", "sale": "", "color": "#7B2D3B", "badge": "", "img": "", "desc": "Sturdy canvas tote with an inner pocket, big enough for daily essentials."}, {"name": "Classic Cotton Cap", "cat": "Accessories", "price": "1500", "sale": "", "color": "#1F3B4D", "badge": "New", "img": "", "desc": "Adjustable back strap and a curved brim in breathable cotton."}, {"name": "Heavy Fleece Hoodie", "cat": "Winter hoodies", "price": "6200", "sale": "4900", "color": "#2F3B52", "badge": "Winter", "img": "", "winter": true, "desc": "Thick, warm fleece made for cold Pakistani winters."}, {"name": "Quilted Puffer Jacket", "cat": "Jackets", "price": "9800", "sale": "", "color": "#4A2E2E", "badge": "New", "img": "", "winter": true, "desc": "Light var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Not saved: storage is full. Use smaller images.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2200)}
function money(v){return S.cur+' '+Number(v).toLocaleString('en-PK')}
function sub(){var e=$('em');if(!/.+@.+\..+/.test(e.value)){toast('Enter a valid email');return}e.value='';toast('You’re on the list')}
function render(){
 S.ship=S.ship||{fee:'250',free:'5000'};S.wa=S.wa||'';S.mail=S.mail||'';$('stp').textContent='Free delivery across Pakistan over '+money(S.ship.free);
 var b=$('bar');b.style.display=S.sale.on?'block':'none';b.innerHTML=esc(S.sale.text)+(S.sale.code?'<b>'+esc(S.sale.code)+'</b>':'');
 $('h1').textContent=S.hero.title;$('hp').textContent=S.hero.sub;$('hb').textContent=S.hero.cta;
 var card=function(p){
  var on=p.sale&&Number(p.sale)<Number(p.price);
  var bg=p.img?'url('+p.img+')':'radial-gradient(circle at 30% 25%,'+esc(p.color)+'99,'+esc(p.color)+' 70%)';
  var tag=on?'<span class="tag s">Sale</span>':(p.badge?'<span class="tag">'+esc(p.badge)+'</span>':'');

 S.winter=S.winter||{on:true,title:'Winter Collection',sub:''};var W=S.winter,reg=S.products.filter(function(p){return !p.winter}),wn=S.products.filter(function(p){return p.winter});$('grid').innerHTML=reg.map(card).join('')||'<p>No products yet.</p>';$('winter').style.display=(W.on&&wn.length)?'block':'none';$('wt').textContent=W.title;$('ws').textContent=W.sub;$('wgrid').innerHTML=wn.map(card).join('');

 $('nav').innerHTML='<a href="#shop">Shop</a>'+(W.on&&wn.length?'<a href="#winter">Winter</a>':'')+S.sections.map(function(s,i){return '<a href="#s'+i+'">'+esc(s.title.split(' ').slice(0,2).join(' '))+'</a>'}).join('')+'<a href="#join">Join</a>';
}

 if(tab=='hero'){h=inp('hero.title','Headline',S.hero.title)+'<label>Subtitle</label><textarea rows="3" data-k="hero.sub">'+esc(S.hero.sub)+'</textarea>'+inp('hero.cta','Button text',S.hero.cta)+'<div class="box"><label><input type="checkbox" data-k="winter.on"'+(S.winter.on?' checked':'')+'>Show Winter Collection</label>'+inp('winter.title','Winter title',S.winter.title)+inp('winter.sub','Winter subtitle',S.winter.sub)+'</div>'}
 if(tab=='products'){h=S.products.map(function(p,i){var k='products.'+i+'.';return '<div class="box"><div class="row">'+inp(k+'name','Name',p.name)+inp(k+'cat','Category',p.cat)+'</div><div class="row">'+inp(k+'price','Price (Rs)',p.price,'decimal')+inp(k+'sale','Sale price (Rs)',p.sale,'decimal')+'</div><div class="row">'+inp(k+'badge','Tag (e.g. New)',p.badge)+'<div><label>Colour</label><input type="color" data-k="'+k+'color" value="'+esc(p.color)+'"></div></div><label>Description</label><textarea rows="2" data-k="'+k+'desc">'+esc(p.desc)+'</textarea><label><input type="checkbox" data-k="'+k+'winter"'+(p.winter?' checked':'')+'>Show in Winter Collection</label><label>Photo</label><input type="file" accept="image/*" data-img="'+i+'"><button class="sm" onclick="rm(\'products\','+i+')">Remove</button>'+(p.img?'<button class="sm" onclick="S.products['+i+'].img=\'\';save();render();adm()">Remove photo</button>':'')+'</div>'}).join('')+'<button class="sm" onclick="S.products.unshift({name:\'New product\',cat:\'Category\',price:\'0\',sale:\'\',color:\'#6A72B8\',badge:\'New\',img:\'\'});save();render();adm()">+ Add product</button>'}
 if(tab=='sections'){h=S.sections.map(function(s,i){var k='sections.'+i+'.';return '<div class="box">'+inp(k+'title','Title',s.title)+'<label>Text</label><textarea rows="4" data-k="'+k+'body">'+esc(s.body)+'</textarea>'+inp(k+'btn','Button text (blank = none)',s.btn)+'<label>Style</label><select data-k="'+k+'tone">'+['deep','warm','light'].map(function(t){return '<option value="'+t+'"'+(s.tone==t?' selected':'')+'>'+{deep:'Dark',warm:'Peach',light:'White'}[t]+'</option>'}).join('')+'</select><button class="sm" onclick="mv('+i+',-1)">Up</button><button class="sm" onclick="mv('+i+',1)">Down</button><button class="sm red" onclick="rm(\'sections\','+i+')">Remove</button></div>'}).join('')+'<button class="sm" onclick="S.sections.push({title:\'New section\',body:\'Write something here.\',btn:\'\',tone:\'light\'});save();render();adm()">+ Add section</button>'}
 if(tab=='data'){h='<p class="hint">Edits save in this browser only. To publish them: copy ALL the text below, then paste it into data.json on GitHub and commit.</p><textarea id="bk" rows="9">'+esc(JSON.stringify(S))+'</textarea><button class="sm" onclick="restore()">Load pasted backup</button><button class="sm red" onclick="if(confirm(\'Discard your edits here and show the published site?\')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}">Discard my edits</button>'}
 $('ab').innerHTML=h;
}
function rm(a,i){if(confirm('Remove this?')){S[a].splice(i,1);save();render();adm()}}
function mv(i,d){var j=i+d;if(j<0||j>=S.sections.length)return;var t=S.sections[i];S.sections[i]=S.sections[j];S.sections[j]=t;save();render();adm()}
function restore(){try{var o=JSON.parse($('bk').value);if(!o.products||!o.sections)throw 0;S=o;save();render();adm();toast('Backup loaded')}catch(e){toast('That backup isn’t valid')}}
function openAdm(){$('adm').classList.add('on');adm()}
function closeAdm(){$('adm').classList.remove('on');if(location.hash=='#admin')location.hash='top'}
$('ab').addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-k');if(!k)return;var v=t.type=='checkbox'?t.checked:t.value,p=k.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;save();render()});
$('ab').addEventListener('change',function(e){var t=e.target,i=t.getAttribute('data-img');if(i===null||!t.files[0])return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.products[i].img=c.toDataURL('image/jpeg',.8);save();render();adm()};im.src=r.result};r.readAsDataURL(t.files[0])});
var step='cart',lastUrl='';
function pr(p){return p.sale&&Number(p.sale)<Number(p.price)?Number(p.sale):Number(p.price)}
function cc(){$('cc').textContent=cart.reduce(function(a,c){return a+c.q},0)}
function add(i){var f=cart.filter(function(c){return c.i===i})[0];if(f)f.q++;else cart.push({i:i,q:1});cc();toast('Added to your bag')}
function sums(){var sub=0;cart.forEach(function(c){var p=S.products[c.i];if(p)sub+=c.q*pr(p)});var fee=(!sub||sub>=Number(S.ship.free))?0:Number(S.ship.fee);return{sub:sub,fee:fee,tot:sub+fee}}
function openC(){step='cart';drawC();$('ct').classList.add('on')}
function closeC(){$('ct').classList.remove('on')}
function qty(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);cc();drawC()}
function drawC(){var b=$('cb'),s=sums(),h='';
 if(step=='done'){b.innerHTML=sent?'<h3>Order placed</h3><p>Thank you! We’ll contact you on your mobile number to confirm delivery. You pay cash on delivery.</p>'+(lastUrl?'<a class="btn" href="'+lastUrl+'" target="_blank" rel="noopener">Message us on WhatsApp</a>':'')+'<button class="lk" onclick="closeC()">Keep shopping</button>':'<h3>Almost done</h3><p>WhatsApp should have opened with your order. Press <b>Send</b> there to confirm it. We’ll message you to confirm delivery. You pay cash on delivery.</p><a class="btn" href="'+lastUrl+'" target="_blank" rel="noopener">Open WhatsApp again</a><button class="lk" onclick="closeC()">Keep shopping</button>';return}
 if(!cart.length){b.innerHTML='<p class="hint">Your bag is empty.</p>';return}
 if(step=='cart'){h=cart.map(function(c,i){var p=S.products[c.i];if(!p)return'';return '<div class="li"><div class="th" style="background:'+(p.img?'url('+p.img+') center/cover':esc(p.color))+'"></div><div class="nm">'+esc(p.name)+'<small>'+money(pr(p))+'</small></div><div class="q"><button onclick="qty('+i+',-1)" aria-label="Less">−</button>'+c.q+'<button onclick="qty('+i+',1)" aria-label="More">+</button></div></div>'}).join('')+'<div class="tot"><span>Subtotal</span><span>'+money(s.sub)+'</span></div><div class="tot"><span>Delivery</span><span>'+(s.fee?money(s.fee):'Free')+'</span></div><div class="tot g"><span>Total, cash on delivery</span><span>'+money(s.tot)+'</span></div>'+(s.fee?'<p class="hint">Add '+money(Math.max(0,Number(S.ship.free)-s.sub))+' more for free delivery.</p>':'')+'<button class="btn" onclick="step=\'form\';drawC()">Checkout</button>'}
 else h='<p class="hint">Cash on delivery. Pay the rider when your order arrives.</p><label for="fn">Full name</label><input id="fn" autocomplete="name"><label for="fp">Mobile number</label><input id="fp" inputmode="tel" placeholder="03XX XXXXXXX" autocomplete="tel"><label for="fc">City</label><input id="fc" autocomplete="address-level2"><label for="fa">Full delivery address</label><textarea id="fa" rows="3" placeholder="House no, street, area"></textarea><label for="fo">Notes (optional)</label><input id="fo"><div class="tot g"><span>Total</span><span>'+money(s.tot)+'</span></div><button class="btn" id="pb" onclick="place()">Place order</button>'+(S.wa?'<button class="lk" onclick="place(\'wa\')">Or send this order on WhatsApp</button><br>':'')+'<button class="lk" onclick="step=\'cart\';drawC()">Back to bag</button>';
 b.innerHTML=h}
var sent=false;
function place(w){var v=function(id){return $(id).value.trim()},n=v('fn'),ph=v('fp').replace(/[\s-]/g,''),ct=v('fc'),ad=v('fa'),nt=v('fo');
 if(!n||!ct||ad.length<8||!/^(\+?92|0)3\d{9}$/.test(ph)){toast('Please enter your name, mobile number, city and full address');return}
 var wa=String(S.wa||'').replace(/\D/g,''),key=String(S.mail||'').trim();if(w=='wa')key='';if(!wa&&!key){toast('Ordering opens soon. Please try again later.');return}
 var s=sums(),id='HH'+Math.floor(1000+Math.random()*9000),items=cart.map(function(c){var p=S.products[c.i];return c.q+' x '+p.name+' = '+money(c.q*pr(p))}).join('\n'),dl=s.fee?money(s.fee):'Free',
 m='*New order '+id+'*\n\n'+items+'\n\nSubtotal: '+money(s.sub)+'\nDelivery: '+dl+'\n*Total (cash on delivery): '+money(s.tot)+'*\n\n*Name:* '+n+'\n*Phone:* '+ph+'\n*City:* '+ct+'\n*Address:* '+ad+(nt?'\n*Notes:* '+nt:'');
 lastUrl=wa?'https://wa.me/'+wa+'?text='+encodeURIComponent(m):'';sent=false;
 var fin=function(){cart=[];cc();step='done';drawC()};
 if(!key){window.open(lastUrl,'_blank');fin();return}
 var bt=$('pb');bt.disabled=true;bt.textContent='Sending your order...';
 fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:key,subject:'New order '+id+' from '+n,from_name:'Hush Hub',order_id:id,confirm_on_whatsapp:'https://wa.me/'+ph.replace(/^\+/,'').replace(/^0/,'92')+'?text='+encodeURIComponent('Assalam o Alaikum '+n+', thank you for ordering from Hush Hub. Your order '+id+' total is '+money(s.tot)+' (cash on delivery). We will deliver to: '+ad+'. Please reply YES to confirm.'),name:n,phone:ph,city:ct,address:ad,notes:nt||'-',order:items,subtotal:money(s.sub),delivery:dl,total:money(s.tot)+' (cash on delivery)'})})
 .then(function(r){return r.json()}).then(function(j){if(!j.success)throw 0;sent=true;fin()})
 .catch(function(){bt.disabled=false;bt.textContent='Place order';if(wa){window.open(lastUrl,'_blank');fin()}else toast('Could not send your order. Please check your internet and try again.')})}
var curP=0;function openP(i){var p=S.products[i];if(!p)return;curP=i;var on=p.sale&&Number(p.sale)<Number(p.price),v=$('pvi');v.style.backgroundImage=p.img?'url('+p.img+')':'radial-gradient(circle at 30% 25%,'+p.color+'99,'+p.color+' 70%)';v.style.backgroundSize=p.img?'contain':'cover';$('pvc').textContent=p.cat;$('pvn').textContent=p.name;$('pvp').innerHTML=on?'<s>'+money(p.price)+'</s> <em>'+money(p.sale)+'</em>':money(p.price);$('pvd').textContent=p.desc||'';$('pv').classList.add('on')}
function closeP(){$('pv').classList.remove('on')}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeP();closeC()}});
function route(){if(location.hash=='#admin')openAdm()}
window.addEventListener('hashchange',route);
function boot(){render();route();try{fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(o){if(o&&o.products&&o.sections){if(!localStorage.getItem(KEY))S=o;else{['mail','wa'].forEach(function(k){if(!S[k]&&o[k])S[k]=o[k]})}render()}}).catch(function(){})}catch(e){}}
boot();
</script>
</body>
